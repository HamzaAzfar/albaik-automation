name: Albaik Automation CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      test_platform:
        description: 'Test Platform to Run'
        required: true
        default: 'mobile'
        type: choice
        options:
          - cross-platform
          - mobile
          - web
          - dual-mobile
      cucumber_tags:
        description: 'Optional: Tags to run specific testcases (e.g., @smoke or @delivery)'
        required: false
        default: ''
        type: string

jobs:
  execute-automation-tests:
    name: Execute E2E Tests on Physical Device
    runs-on: self-hosted
    env:
      TARGET_UDID: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Verify Device or Emulator Availability
        id: check_device
        run: |
          # Find all attached devices that are NOT emulators
          physical_devices=$(adb devices | grep -w "device" | grep -v "emulator" | awk '{print $1}' || true)
          # Find all attached devices that ARE emulators
          emulators=$(adb devices | grep -w "device" | grep "emulator" | awk '{print $1}' || true)
          
          TARGET_UDID=""
          
          if [ -n "$physical_devices" ]; then
            TARGET_UDID=$(echo "$physical_devices" | head -n 1)
            echo "Found Physical Device: $TARGET_UDID. Priority set."
          elif [ -n "$emulators" ]; then
            TARGET_UDID=$(echo "$emulators" | head -n 1)
            echo "No physical device found. Falling back to Emulator: $TARGET_UDID."
          else
            echo "CRITICAL: No physical Android device OR emulator connected/authorized!"
            exit 1
          fi
          
          # Wake up the selected device
          echo "Waking device: $TARGET_UDID"
          adb -s "$TARGET_UDID" shell input keyevent 224 || true
          
          # Export to environment for next steps
          echo "TARGET_UDID=$TARGET_UDID" >> $GITHUB_ENV
        shell: bash

      - name: Execute Automation Test Suite
        env:
          TEST_PLATFORM: ${{ github.event.inputs.test_platform || 'mobile' }}
          CUCUMBER_TAGS: ${{ github.event.inputs.cucumber_tags }}
          CI: true
          CUSTOMER_UDID: ${{ env.TARGET_UDID }}
          DEVICE_NAME: ${{ env.TARGET_UDID }}
          UDID: ${{ env.TARGET_UDID }}
        run: |
          if [ -n "$CUCUMBER_TAGS" ]; then
            npm run test:$TEST_PLATFORM -- --cucumberOpts.tagExpression="$CUCUMBER_TAGS"
          else
            npm run test:$TEST_PLATFORM
          fi
        shell: bash

      - name: Upload Cucumber HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-html-report
          path: cucumber-html-reports
          retention-days: 14

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

      - name: Zip Cucumber Report for Email
        id: zip_report
        if: always()
        run: |
          if [ -d "cucumber-html-reports" ]; then
            zip -r cucumber-html-report.zip cucumber-html-reports
            echo "report_generated=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Cucumber reports directory not found. Skipping zip and email."
            echo "report_generated=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Send Email Notification with Results
        uses: dawidd6/action-send-mail@v3
        if: always() && steps.zip_report.outputs.report_generated == 'true'
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Automation Test Results - ${{ github.repository }}
          to: ${{ secrets.RECIPIENT_EMAIL }}
          cc: ${{ secrets.CC_EMAIL }}
          from: GitHub Actions Bot
          body: |
            Dear Team,
            
            The automated test execution has finished running for the latest code changes.
            
            A ZIP file containing the detailed HTML execution report is attached to this email. Please download the attached ZIP file, extract it, and open 'index.html' in your browser to view the results.
            
            You can also view the GitHub Actions run here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Best Regards,
            QA Automation Team
          attachments: cucumber-html-report.zip
