name: Android Emulator Smoke Tests

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  smoke-test-emulator:
    name: Run Smoke Tests on Emulator
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run ESLint and Prettier Checks
        run: |
          npm run lint || echo "Linting failed, but continuing for now"
          npm run typecheck || echo "Typecheck failed, but continuing for now"

      - name: Run Smoke Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "Emulator started successfully"
            npm run test:cross-platform:tag -- --cucumberOpts.tagExpression="@smoke"

      - name: Upload Cucumber HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-html-report-smoke
          path: cucumber-html-reports
          retention-days: 7

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-smoke
          path: allure-results
          retention-days: 7
